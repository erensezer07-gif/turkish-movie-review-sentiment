{% extends 'base.html' %}

{% block title %}Şifremi Unuttum — SEZER FILM{% endblock %}

{% block content %}
<div class="auth-fullscreen">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark mx-auto mb-3" style="width:48px;height:48px;font-size:1.2rem;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:1.5rem;margin:0 0 8px;letter-spacing:-0.02em;">
                Şifreni mi unuttun?
            </h1>
            <p class="text-dim" style="font-size:0.9rem;margin:0;">
                E-posta adresine sıfırlama linki gönderelim.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="auth-label">E-posta Adresi</label>
                <input type="email" name="email" required autofocus placeholder="ornek@mail.com">
            </div>

            <button type="submit" class="nav-btn nav-btn-primary w-100 justify-content-center"
                style="padding:12px;font-size:0.95rem;">
                <i class="fa-solid fa-paper-plane"></i> Bağlantıyı Gönder
            </button>
        </form>

        <div style="margin-top:20px;text-align:center;">
            <a href="{% url 'login' %}" class="text-dim" style="font-size:0.85rem;text-decoration:none;">
                <i class="fa-solid fa-arrow-left me-1"></i> Giriş sayfasına dön
            </a>
        </div>
    </div>
</div>
{% endblock %}
