{% extends 'base.html' %}

{% block title %}Bağlantı Gönderildi — SEZER FILM{% endblock %}

{% block content %}
<div class="auth-fullscreen">
    <div class="auth-card text-center">
        <div class="mx-auto mb-3"
            style="width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>

        <h1 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:1.5rem;margin:0 0 12px;letter-spacing:-0.02em;">
            Bağlantı gönderildi
        </h1>

        <p class="text-dim" style="font-size:0.9rem;margin:0 0 28px;line-height:1.6;">
            Şifre sıfırlama talimatlarını e-posta adresine gönderdik.<br>
            Gelen kutunu ve <strong>spam klasörünü</strong> kontrol etmeyi unutma.
        </p>

        <a href="{% url 'login' %}" class="nav-btn nav-btn-primary w-100 justify-content-center"
            style="padding:12px;font-size:0.95rem;">
            <i class="fa-solid fa-arrow-left"></i> Giriş Ekranına Dön
        </a>
    </div>
</div>
{% endblock %}
