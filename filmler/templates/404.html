{% extends 'base.html' %}

{% block title %}404 — Sayfa Bulunamadı{% endblock %}

{% block content %}
<div class="container-xl" style="padding: 80px 0;">
    <div class="text-center mx-auto" style="max-width: 480px;">
        <div style="font-family:'Manrope',sans-serif;font-weight:900;font-size:8rem;line-height:1;letter-spacing:-0.05em;
                    background:linear-gradient(135deg, var(--accent), #ff9500);
                    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">
            404
        </div>

        <h1 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:1.6rem;margin:8px 0 12px;letter-spacing:-0.02em;">
            Aradığın sayfa bulunamadı
        </h1>

        <p class="text-dim" style="font-size:0.95rem;margin-bottom:32px;">
            Bağlantı bozuk olabilir veya sayfa kaldırılmış olabilir.
            Anasayfaya dönüp film aramaya devam edebilirsin.
        </p>

        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a href="{% url 'anasayfa' %}" class="nav-btn nav-btn-primary"
                style="padding:11px 22px;font-size:0.92rem;">
                <i class="fa-solid fa-house"></i> Anasayfaya Dön
            </a>
            <a href="{% url 'anasayfa' %}?mode=liste" class="nav-btn nav-btn-ghost"
                style="padding:11px 22px;font-size:0.92rem;">
                <i class="fa-solid fa-film"></i> Tüm Filmler
            </a>
        </div>
    </div>
</div>
{% endblock %}
